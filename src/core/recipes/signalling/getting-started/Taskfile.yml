version: '3'

tasks:
  build:
    desc: Build recipe projects
    cmds:
      - dotnet build Conqueror.Recipes.Signalling.GettingStarted.sln {{.CLI_ARGS}}

  run:completed:
    desc: Run completed recipe app
    cmds:
      - dotnet run --project .completed/Conqueror.Recipes.Signalling.GettingStarted -- {{.CLI_ARGS}}
