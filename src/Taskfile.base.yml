version: '3'

# Base Taskfile with common tasks for all modules
# Include this file and set the SOLUTION_FILE and DESC_PREFIX variables

tasks:
  build:
    desc: Build {{.DESC_PREFIX}} projects
    cmds:
      - dotnet build {{.SOLUTION_FILE}} {{.CLI_ARGS}}

  test:
    desc: Run {{.DESC_PREFIX}} tests
    cmds:
      - dotnet test {{.SOLUTION_FILE}} {{.CLI_ARGS}}

  fmt:
    desc: Format files with csharpier
    cmds:
      - dotnet csharpier format . {{.CLI_ARGS}}

  fmt:check:
    desc: Check formatting with csharpier (for CI)
    cmds:
      - dotnet csharpier check . {{.CLI_ARGS}}

  benchmarks:run:
    desc: Run benchmarks for {{.DESC_PREFIX}}
    cmds:
      - |
        for proj in $(dotnet sln {{.SOLUTION_FILE}} list | grep -i "Benchmarks\.csproj"); do
          echo "Running benchmarks in $proj..."
          dotnet run --project "$proj" -c Release -- {{.CLI_ARGS}}
        done

  test:aot:
    desc: Run AOT compilation tests for {{.DESC_PREFIX}}
    cmds:
      - |
        for proj in $(dotnet sln {{.SOLUTION_FILE}} list | grep -i "Tests\.AOT\.csproj"); do
          echo "Publishing $proj with AOT..."
          dotnet publish "$proj" -c Release
          PROJ_NAME=$(basename $(dirname "$proj"))
          PROJ_DIR=$(dirname "$proj")
          echo "Running AOT test: $PROJ_DIR/bin/Release/net8.0/publish/$PROJ_NAME"
          "$PROJ_DIR/bin/Release/net8.0/publish/$PROJ_NAME"
        done
