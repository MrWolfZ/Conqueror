version: '3'

# Base Taskfile with common tasks for all modules
# Include this file and set the SOLUTION_FILE and DESC_PREFIX variables
vars:
  DOTNET_SDK_DIR:
    sh: |
      ver=$(dotnet --version)
      echo "$(dotnet --list-sdks | grep "^$ver " | sed 's/.*\[\(.*\)\]/\1/')/$ver"

tasks:
  build:
    desc: Build {{.DESC_PREFIX}} projects
    cmds:
      - dotnet build {{.SOLUTION_FILE}} {{.CLI_ARGS}}

  test:
    desc: Run {{.DESC_PREFIX}} tests
    cmds:
      - dotnet test {{.SOLUTION_FILE}} {{.CLI_ARGS}}

  fmt:
    desc: Format changed files with JetBrains tools
    silent: true
    vars:
      CHANGED_FILES:
        sh: |
          repo_root=$(git rev-parse --show-toplevel)
          while IFS= read -r file; do
            rel_path=$(realpath --relative-to=. "$repo_root/$file")
            echo "'$rel_path'"
          done < <(git status --porcelain . | awk '{print $2}')
      NUM_CHANGED_FILES: '{{if gt (.CHANGED_FILES | len) 0}}{{.CHANGED_FILES | splitList "\n" | len}}{{else}}0{{end}}'
    cmds:
      - if: '{{eq (int .NUM_CHANGED_FILES) 0}}'
        cmd: echo "no files changed, skipping formatting"
      - if: '{{eq (int .NUM_CHANGED_FILES) 1}}'
        cmd: echo "formatting {{.NUM_CHANGED_FILES}} file..."
      - if: '{{gt (int .NUM_CHANGED_FILES) 1}}'
        cmd: echo "formatting {{.NUM_CHANGED_FILES}} files..."
      - task: _fmt
        if: '{{gt (int .NUM_CHANGED_FILES) 0}}'
        vars:
          PATHS: '{{.CHANGED_FILES | splitList "\n" | join " " }}'

  fmt:solution:
    desc: Format files with JetBrains tools
    silent: true
    cmds:
      - echo "formatting solution {{.SOLUTION_FILE}}"
      - task: _fmt
        vars:
          PATHS: '{{.SOLUTION_FILE}}'

  _fmt:
    desc: Format a list of paths with JetBrains tools
    silent: true
    internal: true
    requires:
      vars:
        - PATHS
    cmds:
      - |
        dotnet jb cleanupcode {{.PATHS}} \
          --toolset-path="{{.DOTNET_SDK_DIR}}/MSBuild.dll" \
          --dotnetcore="{{.DOTNET_SDK_DIR}}/../../dotnet" \
          --settings="{{.TASKFILE_DIR}}/../.editorconfig" \
          --no-buildin-settings \
          --no-build \
          --profile="Built-in: Reformat Code" \
          --exclude="**/Generated/**" \
          {{.CLI_ARGS}}

  benchmarks:run:
    desc: Run benchmarks for {{.DESC_PREFIX}}
    cmds:
      - |
        for proj in $(dotnet sln {{.SOLUTION_FILE}} list | grep -i "Benchmarks\.csproj"); do
          echo "Running benchmarks in $proj..."
          dotnet run --project "$proj" -c Release -- {{.CLI_ARGS}}
        done

  test:aot:
    desc: Run AOT compilation tests for {{.DESC_PREFIX}}
    cmds:
      - |
        for proj in $(dotnet sln {{.SOLUTION_FILE}} list | grep -i "Tests\.AOT\.csproj"); do
          echo "Publishing $proj with AOT..."
          dotnet publish "$proj" -c Release
          PROJ_NAME=$(basename $(dirname "$proj"))
          PROJ_DIR=$(dirname "$proj")
          echo "Running AOT test: $PROJ_DIR/bin/Release/net8.0/publish/$PROJ_NAME"
          "$PROJ_DIR/bin/Release/net8.0/publish/$PROJ_NAME"
        done
