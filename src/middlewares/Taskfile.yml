version: '3'

tasks:
  build:
    desc: Build all middleware projects
    cmds:
      - dotnet build Middlewares.sln {{.CLI_ARGS}}

  test:
    desc: Run all middleware tests
    cmds:
      - dotnet test Middlewares.sln {{.CLI_ARGS}}

  fmt:
    desc: Format files with csharpier
    cmds:
      - dotnet csharpier format . {{.CLI_ARGS}}

  fmt:check:
    desc: Check formatting with csharpier (for CI)
    cmds:
      - dotnet csharpier check . {{.CLI_ARGS}}
