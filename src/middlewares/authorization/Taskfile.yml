version: '3'

tasks:
  build:
    desc: Build all authorization middleware projects
    cmds:
      - dotnet build Conqueror.Middleware.Authorization.sln {{.CLI_ARGS}}

  test:
    desc: Run authorization middleware tests
    cmds:
      - dotnet test Conqueror.Middleware.Authorization.sln {{.CLI_ARGS}}

  fmt:
    desc: Format files with csharpier
    cmds:
      - dotnet csharpier format . {{.CLI_ARGS}}

  fmt:check:
    desc: Check formatting with csharpier (for CI)
    cmds:
      - dotnet csharpier check . {{.CLI_ARGS}}
